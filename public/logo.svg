<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <style>
      .logo-tile  { fill: #4F46E5; }
      .logo-title { fill: #1A2230; }
      @media (prefers-color-scheme: dark) {
        .logo-tile  { fill: #6366F1; }
        .logo-title { fill: #E8ECF2; }
      }
    </style>
  </defs>

  <g transform="translate(20, 19) scale(1.75)">
    <rect class="logo-tile" width="64" height="64" rx="14"/>
    <polyline points="12,44 24,32 34,39 48,20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="20" r="6" fill="#97C459"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="150" y="91" font-size="52" font-weight="700" class="logo-title" letter-spacing="-0.5">Testboard</text>
  </g>
</svg>
