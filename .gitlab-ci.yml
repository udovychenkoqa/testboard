# ──────────────────────────────────────────────────────────────────────────────
# Testboard CI — build + deploy on push to master, publish @testboard/reporter on tags.
# ──────────────────────────────────────────────────────────────────────────────
# Build and deploy come from honeytech-video-platform/devops/etc (ci/tools/testboard/.gitlab-ci.yml):
# the image goes to this project's registry, then Argo CD (app develop-testboard) rolls it out on
# aws-k8s-tf-uw2-ht-hm-dev and waits until the pod is healthy (IT-36320).
# Runtime settings and secrets are in Vault, not in CI/CD variables:
#   aws-k8s-tf-uw2-ht-hm-dev/apps/testboard/dev/secrets  (API_TOKEN, AUTH_SECRET, AUTH_GOOGLE_*,
#   AUTH_ADMIN_EMAILS, ANTHROPIC_API_KEY, GITLAB_TOKEN, GITLAB_AUTOTESTS_PROJECT, GITLAB_REF)
# Non-secret settings: charts/tools/testboard/values.develop.yaml in devops/etc.
#
# Publishing the reporter: bump packages/reporter/package.json "version", merge, then push a tag
# `reporter-v<that version>`. The job authenticates with CI_JOB_TOKEN; consumer projects must be allowed
# in this project's Settings → CI/CD → Job token permissions.
# ──────────────────────────────────────────────────────────────────────────────

include:
  - project: honeytech-video-platform/devops/etc
    ref: master
    file: ci/tools/testboard/.gitlab-ci.yml

stages:
  - build
  - deploy
  - publish

publish-reporter:
  stage: publish
  image: node:22-alpine
  tags:
    - hz-k3s-gitlab-runner-global
  rules:
    - if: $CI_COMMIT_TAG =~ /^reporter-v/
  script:
    - cd packages/reporter
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "reporter-v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "Tag $CI_COMMIT_TAG does not match package version $VERSION" >&2
        exit 1
      fi
    # tsc and the Playwright types come from the repo root.
    - (cd ../.. && npm ci --ignore-scripts --no-audit --no-fund)
    - ../../node_modules/.bin/tsc -p .
    - REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - echo "@testboard:registry=${REGISTRY}" > .npmrc
    - echo "${REGISTRY#*:}:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
